# Deploy Spike 03 to GitHub Pages.
#
# This file lives inside the spike directory for portability. When you
# copy the spike to its own repo (recommended — see README), this
# workflow goes to .github/workflows/deploy.yml at the repo root and
# the working-directory line is dropped.
#
# Setup checklist (repo settings → Pages):
#   1. Source: "GitHub Actions" (not "Deploy from a branch").
#   2. Workflow permissions (repo settings → Actions → General):
#      "Read and write permissions" + "Allow GitHub Actions to create
#      and approve pull requests" — actually only the first is needed
#      for Pages.
#   3. Push to main and watch the Action run.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build with correct base path
        # Pages serves at https://<user>.github.io/<repo>/
        # BASE_PATH is read by vite.config.ts
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
