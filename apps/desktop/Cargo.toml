[package]
name = "hipo"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hipo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[features]
# Marker feature: gates the `.plugin(tauri_plugin_playwright::init())`
# call in `lib.rs`. The crate itself is always linked (Tauri's build
# script needs it present to resolve the `playwright:default`
# capability entry in `capabilities/default.json`), so this flag only
# controls whether the test socket bridge is actually started at
# runtime. Enable with `cargo tauri dev -- --features e2e-testing`
# for Playwright smoke runs.
e2e-testing = []

[dependencies]
# Framework shell: window bring-up, single-instance focus, updater.
tauri-shell = { path = "../../packages/tauri-shell" }
tauri = { version = "2", features = [] }
# Tauri's build script scans direct dependencies for plugin manifests
# (capability schemas + permission lists). Even though tauri-shell uses
# these internally, the consumer crate has to list them so the
# capabilities/default.json `updater:default` permission resolves at
# build time.
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
# Always linked so the `playwright:default` capability resolves at
# build time. The plugin is only initialized when the `e2e-testing`
# feature is on — otherwise its socket bridge never starts, so a
# normal user-facing build doesn't expose test surface.
tauri-plugin-playwright = "0.2"
serde = { version = "1", features = ["derive"] }
# tauri::generate_context! needs serde_json visible at the call site
serde_json = "1"
