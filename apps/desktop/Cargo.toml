[package]
name = "hipo"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hipo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[dependencies]
# Framework shell: window bring-up, single-instance focus, updater.
tauri-shell = { path = "../../packages/tauri-shell" }
tauri = { version = "2", features = [] }
# Tauri's build script scans direct dependencies for plugin manifests
# (capability schemas + permission lists). Even though tauri-shell uses
# these internally, the consumer crate has to list them so the
# capabilities/default.json `updater:default` permission resolves at
# build time.
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
# tauri::generate_context! needs serde_json visible at the call site
serde_json = "1"
