name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            tauri-target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            tauri-target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.tauri-target }}

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install workspace deps
        run: npm ci

      - name: Stamp version from tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Stamping version: $VERSION"
          sed -i 's/^  "version": "[^"]*",$/  "version": "'"$VERSION"'",/' apps/hipo/tauri/tauri.conf.json
          sed -i '0,/^version = "[^"]*"$/{s/^version = "[^"]*"$/version = "'"$VERSION"'"/}' apps/hipo/tauri/Cargo.toml
          sed -i 's/APP_VERSION = "[^"]*"/APP_VERSION = "'"$VERSION"'"/' apps/hipo/src/version.ts
          grep '"version":' apps/hipo/tauri/tauri.conf.json | head -1
          grep '^version =' apps/hipo/tauri/Cargo.toml | head -1
          cat apps/hipo/src/version.ts

      # The Tauri shell no longer spawns a Deno sidecar (Phase 8A trimmed
      # it out — see packages/tauri-shell/src/lib.rs and
      # apps/hipo/tauri/tauri.conf.json's lack of `externalBin`). tauri-action's
      # `beforeBuildCommand` (configured in tauri.conf.json) builds the
      # in-page frontend bundle, which IS the backend now.

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/hipo/tauri
          tagName: ${{ github.ref_name }}
          releaseName: "hipo ${{ github.ref_name }}"
          releaseBody: "See the assets to download and install."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.tauri-target }}
