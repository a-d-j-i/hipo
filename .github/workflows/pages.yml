name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deploy needs id-token (OIDC) + pages write.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; queue but don't cancel the in-flight
# one (cancellation can leave Pages in a broken half-published state).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install workspace deps
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build templates/minimal
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/minimal/
        run: npm run build -w @hipo/templates-minimal

      - name: Build hipo (in-page)
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/hipo/
        run: npm run build:frontend:inpage

      - name: Assemble _site
        run: |
          set -euo pipefail
          mkdir -p _site/minimal _site/hipo
          cp -r templates/minimal/dist/. _site/minimal/
          cp -r apps/frontend/dist/. _site/hipo/
          cp pages/index.html _site/index.html

          # Stamp the landing page with this deploy's commit + date.
          SHA="${GITHUB_SHA::7}"
          DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          sed -i "s|<code id=\"commit\">unknown</code>|<code id=\"commit\">${SHA}</code>|" _site/index.html
          sed -i "s|<span id=\"deployed\">unknown</span>|<span id=\"deployed\">${DATE}</span>|" _site/index.html

      - name: Assert merged SW landed in each consumer
        run: |
          set -euo pipefail
          test -s _site/minimal/sw.js   # @hipo/sw plugin emit
          test -s _site/hipo/sw.js
          # index.html must register the SW (verified by the runtime register
          # call in in-page-backend.ts; here we just confirm the SW file exists
          # and is non-empty).
          test -s _site/minimal/index.html
          test -s _site/hipo/index.html
          echo "SW + index assertions passed."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install workspace deps
        run: npm ci

      - name: Install Playwright browsers (chromium only)
        run: npx playwright install --with-deps chromium
        working-directory: templates/minimal

      - name: Run post-deploy smoke
        env:
          SMOKE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node templates/minimal/smoke-deployed.mjs
